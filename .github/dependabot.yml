version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # MMKV 2.x ships no armeabi-v7a/x86 libraries; the app supports 32-bit
      # phones and TVs, so it stays on the 1.3.x LTS line (patches only).
      - dependency-name: "com.tencent:mmkv-static"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
