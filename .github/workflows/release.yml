name: Android signed release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Materialize temporary keystore
        env:
          KEYSTORE_B64: ${{ secrets.COLITU_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          mkdir -p "$RUNNER_TEMP/colitu-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/colitu-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/colitu-signing/release.jks"
      - name: Build signed bundle
        working-directory: V2rayNG
        env:
          COLITU_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/colitu-signing/release.jks
          COLITU_ANDROID_STORE_PASSWORD: ${{ secrets.COLITU_ANDROID_STORE_PASSWORD }}
          COLITU_ANDROID_KEY_ALIAS: ${{ secrets.COLITU_ANDROID_KEY_ALIAS }}
          COLITU_ANDROID_KEY_PASSWORD: ${{ secrets.COLITU_ANDROID_KEY_PASSWORD }}
          COLITU_REQUIRE_RELEASE_SIGNING: 'true'
        run: ./gradlew testPlaystoreReleaseUnitTest lintPlaystoreRelease bundlePlaystoreRelease --no-daemon
      - name: Verify signature
        run: |
          out=V2rayNG/app/build/outputs/bundle/playstoreRelease
          jarsigner -verify -strict $out/app-playstore-release.aab
          sha256sum $out/app-playstore-release.aab > $out/SHA256SUMS
          sha256sum V2rayNG/app/libs/libv2ray.aar > $out/libv2ray.aar.sha256
          cd V2rayNG && ./gradlew app:dependencies --configuration playstoreReleaseRuntimeClasspath > app/build/outputs/bundle/playstoreRelease/dependencies.txt
      - name: Generate CycloneDX SBOM
        run: |
          python scripts/generate-android-sbom.py \
            --dependencies V2rayNG/app/build/outputs/bundle/playstoreRelease/dependencies.txt \
            --artifact V2rayNG/app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab \
            --native-dir V2rayNG/app/libs \
            --version "${GITHUB_REF_NAME#v}" \
            --output V2rayNG/app/build/outputs/bundle/playstoreRelease/colitu-android.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: colitu-android-${{ github.ref_name }}
          path: V2rayNG/app/build/outputs/bundle/playstoreRelease/
          if-no-files-found: error
          retention-days: 14
