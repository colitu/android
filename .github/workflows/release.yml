name: Android signed release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Exact JDK (javac output can change between releases); same as docs/reproducible-builds.md.
          java-version: '21.0.12'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Verify prebuilt VPN core
        # The Xray AAR and hev-socks5-tunnel libraries are committed binaries
        # (docs/core-provenance.md); any change must update SHA256SUMS on purpose.
        working-directory: android/app/libs
        run: sha256sum -c SHA256SUMS
      - name: Rebuild the Go sidecars from source
        # libcolituengine.so and libcslclient.so must come out byte for byte from the
        # colitu/csl commit and Go release pinned in scripts/sidecars.env (GOTOOLCHAIN
        # fetches that exact Go from the Go module proxy, checksum-verified).
        run: bash scripts/build-sidecars.sh
      - name: Rebuild hev-socks5-tunnel from source
        # libhev-socks5-tunnel.so must come out byte for byte from the hev commit
        # and the NDK release pinned in scripts/hev.env (compile-hevtun.sh).
        run: |
          . scripts/hev.env
          sdkmanager --install "ndk;$HEV_NDK" > /dev/null
          NDK_HOME="$ANDROID_HOME/ndk/$HEV_NDK" bash compile-hevtun.sh
      - name: Materialize temporary keystore
        env:
          KEYSTORE_B64: ${{ secrets.COLITU_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          mkdir -p "$RUNNER_TEMP/colitu-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/colitu-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/colitu-signing/release.jks"
      - name: Build signed bundle
        working-directory: android
        env:
          COLITU_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/colitu-signing/release.jks
          COLITU_ANDROID_STORE_PASSWORD: ${{ secrets.COLITU_ANDROID_STORE_PASSWORD }}
          COLITU_ANDROID_KEY_ALIAS: ${{ secrets.COLITU_ANDROID_KEY_ALIAS }}
          COLITU_ANDROID_KEY_PASSWORD: ${{ secrets.COLITU_ANDROID_KEY_PASSWORD }}
          COLITU_REQUIRE_RELEASE_SIGNING: 'true'
          # API mirror origins; required by build.gradle.kts for a signed release.
          # (Ad-block resolvers are not built in: the panel's bootstrap names them.)
          COLITU_MIRRORS: ${{ secrets.COLITU_MIRRORS }}
        # Play: signed AAB. colitu.com: the self-updating "direct" APKs.
        run: ./gradlew testPlaystoreReleaseUnitTest lintPlaystoreRelease lintDirectRelease bundlePlaystoreRelease assembleDirectRelease --no-daemon
      - name: Native libraries in every ABI
        # MMKV, the Xray core and hev for each ABI of the AAB and of every direct APK.
        run: |
          bash scripts/check-native-libs.sh android/app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab android/app/build/outputs/apk/direct/release/*.apk
      - name: Verify signature
        run: |
          out=android/app/build/outputs/bundle/playstoreRelease
          jarsigner -verify -strict $out/app-playstore-release.aab
          cp android/app/build/outputs/apk/direct/release/*.apk $out/
          (cd $out && sha256sum *.apk > SHA256SUMS-direct)
          sha256sum $out/app-playstore-release.aab > $out/SHA256SUMS
          sha256sum android/app/libs/libv2ray.aar > $out/libv2ray.aar.sha256
          cd android && ./gradlew app:dependencies --configuration playstoreReleaseRuntimeClasspath > app/build/outputs/bundle/playstoreRelease/dependencies.txt
      - name: Generate CycloneDX SBOM
        run: |
          python scripts/generate-android-sbom.py \
            --dependencies android/app/build/outputs/bundle/playstoreRelease/dependencies.txt \
            --artifact android/app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab \
            --native-dir android/app/libs \
            --version "${GITHUB_REF_NAME#v}" \
            --output android/app/build/outputs/bundle/playstoreRelease/colitu-android.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: colitu-android-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/playstoreRelease/
          if-no-files-found: error
          retention-days: 14
