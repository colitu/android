name: Android signed release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Verify prebuilt VPN core
        # The Xray AAR and hev-socks5-tunnel libraries are committed binaries
        # (docs/core-provenance.md); any change must update SHA256SUMS on purpose.
        working-directory: android/app/libs
        run: sha256sum -c SHA256SUMS
      - name: Materialize temporary keystore
        env:
          KEYSTORE_B64: ${{ secrets.COLITU_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          mkdir -p "$RUNNER_TEMP/colitu-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/colitu-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/colitu-signing/release.jks"
      - name: Build signed bundle
        working-directory: android
        env:
          COLITU_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/colitu-signing/release.jks
          COLITU_ANDROID_STORE_PASSWORD: ${{ secrets.COLITU_ANDROID_STORE_PASSWORD }}
          COLITU_ANDROID_KEY_ALIAS: ${{ secrets.COLITU_ANDROID_KEY_ALIAS }}
          COLITU_ANDROID_KEY_PASSWORD: ${{ secrets.COLITU_ANDROID_KEY_PASSWORD }}
          COLITU_REQUIRE_RELEASE_SIGNING: 'true'
          # Ad-block DoH hosts (node domains) stay out of the repository.
          COLITU_ADBLOCK_DOH: ${{ secrets.COLITU_ADBLOCK_DOH }}
        # Play: signed AAB. colitu.com: the self-updating "direct" APKs.
        run: ./gradlew testPlaystoreReleaseUnitTest lintPlaystoreRelease bundlePlaystoreRelease assembleDirectRelease --no-daemon
      - name: Verify signature
        run: |
          out=android/app/build/outputs/bundle/playstoreRelease
          jarsigner -verify -strict $out/app-playstore-release.aab
          cp android/app/build/outputs/apk/direct/release/*.apk $out/
          (cd $out && sha256sum *.apk > SHA256SUMS-direct)
          sha256sum $out/app-playstore-release.aab > $out/SHA256SUMS
          sha256sum android/app/libs/libv2ray.aar > $out/libv2ray.aar.sha256
          cd android && ./gradlew app:dependencies --configuration playstoreReleaseRuntimeClasspath > app/build/outputs/bundle/playstoreRelease/dependencies.txt
      - name: Generate CycloneDX SBOM
        run: |
          python scripts/generate-android-sbom.py \
            --dependencies android/app/build/outputs/bundle/playstoreRelease/dependencies.txt \
            --artifact android/app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab \
            --native-dir android/app/libs \
            --version "${GITHUB_REF_NAME#v}" \
            --output android/app/build/outputs/bundle/playstoreRelease/colitu-android.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colitu-android-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/playstoreRelease/
          if-no-files-found: error
          retention-days: 14
