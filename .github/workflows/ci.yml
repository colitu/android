name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Verify prebuilt VPN core
        # The Xray AAR and hev-socks5-tunnel libraries are committed binaries
        # (docs/core-provenance.md); any change must update SHA256SUMS on purpose.
        working-directory: android/app/libs
        run: sha256sum -c SHA256SUMS
      - name: Unit, lint and unsigned PR artifact
        working-directory: android
        run: |
          ./gradlew testPlaystoreDebugUnitTest lintPlaystoreRelease lintDirectRelease compilePlaystoreDebugAndroidTestKotlin assemblePlaystoreDebug --no-daemon
          sha256sum app/libs/libv2ray.aar > app/build/libv2ray.aar.sha256
          ./gradlew app:dependencies --configuration playstoreReleaseRuntimeClasspath > app/build/playstore-release-dependencies.txt
      - name: Native libraries in every ABI
        # Each APK must carry MMKV, the Xray core and hev for its ABI (a dependency
        # that drops 32-bit ABIs would crash those devices at start).
        run: bash scripts/check-native-libs.sh android/app/build/outputs/apk/playstore/debug/*.apk
      - name: Generate CycloneDX SBOM
        run: |
          python scripts/generate-android-sbom.py \
            --dependencies android/app/build/playstore-release-dependencies.txt \
            --artifact "$(find android/app/build/outputs/apk/playstore/debug -name '*_universal.apk' -print -quit)" \
            --native-dir android/app/libs \
            --version "$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts | head -n 1)-ci" \
            --output android/app/build/colitu-android.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-ci-provenance
          path: |
            android/app/build/libv2ray.aar.sha256
            android/app/build/playstore-release-dependencies.txt
            android/app/build/colitu-android.cdx.json
          if-no-files-found: error
